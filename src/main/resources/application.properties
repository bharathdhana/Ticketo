spring.application.name=Ticketo
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/ticketo
spring.datasource.username=postgres
spring.datasource.password=${DB_PWD}
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

cloudinary.cloud-name=${CLOUDINARY_NAME}
cloudinary.api-key=${CLOUDINARY_APIKEY}
cloudinary.api-secret=${CLOUDINARY_SECRETKEY}

jwt.secret=${JWT_SECRET}
